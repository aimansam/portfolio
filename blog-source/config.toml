baseURL = 'https://portfolio.aimansam.my/blog/'
locale = 'en-us'
title = 'zx10r Security Notes'
theme = "PaperMod"

enableRobotsTXT = true
disableHugoGeneratorInject = true
summaryLength = 24

[outputs]
	home = ["HTML"]
	section = ["HTML"]
	taxonomy = ["HTML"]
	term = ["HTML"]

[params]
	author = 'zx10r'
	description = 'Security writeups, lab notes, CTF workflows, and lessons from practical offensive and defensive security work.'
	defaultTheme = 'auto'
	ShowReadingTime = true
	ShowPostNavLinks = true
	ShowBreadCrumbs = true
	ShowCodeCopyButtons = true
	ShowRssButtonInSectionTermList = false
	ShowShareButtons = false
	disableSpecial1stPost = true
	comments = false

	[params.assets]
		favicon = 'favicon.svg'
		favicon16x16 = 'favicon.svg'
		favicon32x32 = 'favicon.svg'
		apple_touch_icon = 'favicon.svg'
		safari_pinned_tab = 'favicon.svg'

	[params.footer]
		text = 'Labs, writeups, and security notes'

	[params.homeInfoParams]
		Title = 'Security notes from the lab.'
		Content = 'Hands-on security writeups covering CTFs, Active Directory labs, web exploitation, privilege escalation, and defensive lessons from offensive practice.'

[[params.socialIcons]]
	name = 'github'
	url = 'https://github.com/aimansam'

[[params.socialIcons]]
	name = 'linkedin'
	url = 'https://www.linkedin.com/in/aimansam'

