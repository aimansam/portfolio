<path class="h" style="--d:0.62s" d="M200 175 V238 H255" fill="none" stroke="none" stroke-width="2" marker-end="url(#a)"/>
<text class="n" style="--d:0.62s" x="210" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5c5c5c">API</text>
