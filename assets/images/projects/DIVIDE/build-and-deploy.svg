<rect x="30" y="335" width="740" height="115" rx="14" fill="none" stroke="#141414" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="46" y="361" font-size="13" font-weight="800" letter-spacing="1.6" fill="#5c5c5c">BUILD AND DEPLOY</text>
</g>
<g class="n" style="--d:1.12s">
<rect x="50" y="368" width="150" height="64" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="125.0" y="395.0" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Local dev</text>
<text x="125.0" y="414.0" text-anchor="middle" font-size="12" font-weight="500" fill="#5c5c5c">Wrangler, or Flask</text>
</g>
