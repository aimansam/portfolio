<text x="520.0" y="414.0" text-anchor="middle" font-size="12" font-weight="500" fill="#5c5c5c">push to main</text>
<rect x="630" y="368" width="125" height="64" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="692.5" y="395.0" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Auto deploy</text>
<text x="692.5" y="414.0" text-anchor="middle" font-size="12" font-weight="500" fill="#5c5c5c">Cloudflare Pages</text>
<path d="M200 400 H240" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#a)"/>
<path d="M410 400 H450" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#a)"/>
<path d="M590 400 H630" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#a)"/>
</svg>
