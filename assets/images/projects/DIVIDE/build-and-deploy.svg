<rect x="255" y="200" width="235" height="76" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="372.5" y="223.0" text-anchor="middle" font-size="15" font-weight="700" fill="#141414">Pages Function</text>
<text x="372.5" y="243.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5c5c5c">JavaScript API</text>
<text x="372.5" y="263.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5c5c5c">serves content by day</text>
</g>
