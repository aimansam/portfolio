<rect x="240" y="368" width="170" height="64" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="325.0" y="395.0" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Build script</text>
<text x="325.0" y="414.0" text-anchor="middle" font-size="12" font-weight="500" fill="#5c5c5c">regenerates the HTML</text>
</g>
