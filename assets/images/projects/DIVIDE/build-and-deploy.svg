<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">How the DIVIDE recipe challenge is built</title><desc id="d">A browser loads a static site and calls a JavaScript Pages Function on Cloudflare Pages. The function reads the flag from a Cloudflare secret. Code is pushed to GitHub, which redeploys Cloudflare Pages automatically. Locally the challenge runs with Wrangler, or with Flask in Docker for parity.</desc>
<style>
.pkt{display:none}
@media (prefers-reduced-motion: no-preference){
  .n{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
  .a{stroke-dasharray:1;animation:draw .6s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
  .h{animation:head .2s ease-out calc(var(--d,0s) + .4s) both}
  .pkt{display:block;offset-rotate:0deg;animation:ride var(--t,5s) cubic-bezier(.45,0,.55,1) var(--d,0s) both}
}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.93)}to{opacity:1;transform:none}}
@keyframes draw{0%{opacity:0;stroke-dashoffset:1}1%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
@keyframes head{from{opacity:0}to{opacity:1}}
@keyframes ride{0%{offset-distance:0%;opacity:0}6%{opacity:1}94%{opacity:1}100%{offset-distance:100%;opacity:0}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141414"/></marker></defs>
<rect width="800" height="470" fill="#ffffff"/>
