<path class="h" style="--d:1.42s" d="M410 400 H450" fill="none" stroke="none" stroke-width="2" marker-end="url(#a)"/>
<g class="n" style="--d:1.52s">
<rect x="450" y="368" width="140" height="64" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
