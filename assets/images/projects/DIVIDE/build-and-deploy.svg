<path class="h" style="--d:0.42s" d="M170 175 H200 V118 H255" fill="none" stroke="none" stroke-width="2" marker-end="url(#a)"/>
<text class="n" style="--d:0.42s" x="212" y="108" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5c5c5c">page</text>
