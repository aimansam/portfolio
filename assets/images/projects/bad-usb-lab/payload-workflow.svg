<text x="266" y="73" font-size="15.5" font-weight="800" fill="#141414">Check setup</text>
<text x="236" y="110" font-size="13" font-weight="500" fill="#5c5c5c">User session, window</text>
<text x="236" y="131" font-size="13" font-weight="500" fill="#5c5c5c">focus and language</text>
</g>
