<text x="460" y="73" font-size="15.5" font-weight="800" fill="#141414">Inject keys</text>
<text x="430" y="110" font-size="13" font-weight="500" fill="#5c5c5c">Delays tuned so the</text>
<text x="430" y="131" font-size="13" font-weight="500" fill="#5c5c5c">payload runs reliably</text>
</g>
