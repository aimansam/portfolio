</g>
<g class="n" style="--d:1.42s">
<rect x="739.5" y="250" width="218.5" height="38" rx="8" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text x="848.75" y="274" text-anchor="middle" font-size="13.5" font-weight="700" fill="#141414">User awareness</text>
</g>
<g class="pkt" style="--d:1.72s;--t:4s;offset-path:path('M112.0 104.0 H888.0')"><circle r="10" fill="#ffffff" fill-opacity=".85"/><circle r="6.5" fill="#d9291c"/></g>
