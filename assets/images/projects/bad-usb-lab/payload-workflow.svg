<text x="848" y="73" font-size="15.5" font-weight="800" fill="#141414">Indicators</text>
<text x="818" y="110" font-size="13" font-weight="500" fill="#5c5c5c">Host events defenders</text>
<text x="818" y="131" font-size="13" font-weight="500" fill="#5c5c5c">should watch for</text>
