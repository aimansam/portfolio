<title id="t">OxBlood architecture</title><desc id="d">Players and referees reach a Docker Compose stack through Traefik and the Flask portal. The FastAPI backend stores state in PostgreSQL, Redis and MinIO and controls Proxmox VE, which hosts the isolated training range. Prometheus, Alertmanager and Grafana watch the stack.</desc>
