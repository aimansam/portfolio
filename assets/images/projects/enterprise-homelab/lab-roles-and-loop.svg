<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Enterprise home lab: roles and the test-and-detect loop</title><desc id="d">Attacker systems test a segmented enterprise network made of a domain controller, user workstations and Linux servers. Logs forward to logging and monitoring nodes with SIEM visibility. A loop of five steps improves detections: build the environment, introduce a vulnerable path, test exploitation, observe telemetry, refine detections.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141414"/></marker></defs>
<rect width="1000" height="500" fill="#ffffff"/>
<rect x="30" y="95" width="160" height="90" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="110.0" y="135.0" text-anchor="middle" font-size="16" font-weight="500" fill="#5c5c5c">Attacker</text>
<text x="110.0" y="156.0" text-anchor="middle" font-size="14" font-weight="500" fill="#5c5c5c">systems</text>
<rect x="250" y="40" width="420" height="200" rx="14" fill="none" stroke="#141414" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="266" y="66" font-size="13" font-weight="800" letter-spacing="1.6" fill="#5c5c5c">SEGMENTED ENTERPRISE NETWORK</text>
<rect x="270" y="80" width="125" height="70" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="332.5" y="110.0" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Domain</text>
<text x="332.5" y="129.0" text-anchor="middle" font-size="12" font-weight="500" fill="#5c5c5c">controller</text>
<rect x="405" y="80" width="125" height="70" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="467.5" y="110.0" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">User</text>
<text x="467.5" y="129.0" text-anchor="middle" font-size="12" font-weight="500" fill="#5c5c5c">workstations</text>
<rect x="540" y="80" width="115" height="70" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="597.5" y="110.0" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Linux</text>
<text x="597.5" y="129.0" text-anchor="middle" font-size="12" font-weight="500" fill="#5c5c5c">servers</text>
<text x="460" y="205" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5c5c5c">network separation imitates trust boundaries</text>
<path d="M190 140 H250" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#a)"/>
<text x="220" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5c5c5c">attacks</text>
<rect x="730" y="40" width="240" height="200" rx="14" fill="none" stroke="#141414" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="746" y="66" font-size="13" font-weight="800" letter-spacing="1.6" fill="#5c5c5c">MONITORING</text>
<rect x="750" y="80" width="200" height="56" rx="10" fill="#ffffff" stroke="#141414" stroke-width="2"/>
<text x="850.0" y="112.5" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">Log forwarding</text>
<rect x="750" y="150" width="200" height="56" rx="10" fill="#ffffff" stroke="#141414" stroke-width="2"/>
<text x="850.0" y="182.5" text-anchor="middle" font-size="14" font-weight="700" fill="#141414">SIEM visibility</text>
<path d="M670 140 H730" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5c5c5c">logs</text>
<text x="30" y="292" font-size="13" font-weight="800" letter-spacing="1.6" fill="#5c5c5c">THE LOOP</text>
<rect x="26" y="308" width="172" height="70" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="112.0" y="338.0" text-anchor="middle" font-size="15" font-weight="700" fill="#141414">Build</text>
<text x="112.0" y="358.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5c5c5c">the environment</text>
