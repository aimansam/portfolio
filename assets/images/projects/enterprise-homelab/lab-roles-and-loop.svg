<text x="306.0" y="358.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5c5c5c">a vulnerable path</text>
<path d="M392 343 H414" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#a)"/>
<rect x="414" y="308" width="172" height="70" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="500.0" y="338.0" text-anchor="middle" font-size="15" font-weight="700" fill="#141414">Test</text>
<text x="500.0" y="358.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5c5c5c">exploitation</text>
<path d="M586 343 H608" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#a)"/>
<rect x="608" y="308" width="172" height="70" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="694.0" y="338.0" text-anchor="middle" font-size="15" font-weight="700" fill="#141414">Observe</text>
<text x="694.0" y="358.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5c5c5c">telemetry</text>
<path d="M780 343 H802" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#a)"/>
<rect x="802" y="308" width="172" height="70" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<text x="888.0" y="338.0" text-anchor="middle" font-size="15" font-weight="700" fill="#141414">Refine</text>
<text x="888.0" y="358.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5c5c5c">detections</text>
<path d="M898 378 V430 H112 V378" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#a)"/><text x="505" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#5c5c5c">Repeat: every cycle improves detection coverage for the exact techniques exercised</text>
</svg>
