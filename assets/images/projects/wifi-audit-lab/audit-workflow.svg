<text x="72" y="73" font-size="15.5" font-weight="800" fill="#141414">Recon</text>
<text x="42" y="110" font-size="13" font-weight="500" fill="#5c5c5c">Discover nearby</text>
<text x="42" y="131" font-size="13" font-weight="500" fill="#5c5c5c">networks and clients</text>
