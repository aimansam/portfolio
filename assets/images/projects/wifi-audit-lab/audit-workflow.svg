<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Wireless audit workflow</title><desc id="d">Five steps: reconnaissance of nearby networks, packet capture and inspection, analysis of misconfigurations and encryption posture, simulation of rogue access points, deauthentication and credential capture in a safe audit context, then a report that pairs findings with remediation. Remediation themes: encryption, client isolation, SSID trust, monitoring and user training.</desc>
