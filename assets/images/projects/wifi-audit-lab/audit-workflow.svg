<rect x="608" y="40" width="172" height="128" rx="10" fill="#f7f7f7" stroke="#141414" stroke-width="2"/>
<circle cx="632" cy="68" r="14" fill="#141414"/><text x="632" y="73" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
<text x="654" y="73" font-size="15.5" font-weight="800" fill="#141414">Simulate</text>
<text x="624" y="110" font-size="13" font-weight="500" fill="#5c5c5c">Rogue AP, deauth,</text>
<text x="624" y="131" font-size="13" font-weight="500" fill="#5c5c5c">credential capture</text>
