name: Deploy Portfolio and Blog
on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build JSON blog and homepage data
        run: npm run build

      - name: Sync Homepage SEO
        run: |
          chmod +x ./scripts/sync-seo.sh
          ./scripts/sync-seo.sh ./content/site/seo.json ./index.html
          
      - name: Organize Files
        run: |
          mkdir staging
          # 1. Copy root portfolio files (excluding source/git folders)
          # This assumes your main portfolio is at the root
          rsync -av --exclude='blog-source' --exclude='public' --exclude='.git*' --exclude='staging' ./ staging/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./staging

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
