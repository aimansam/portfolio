name: Deploy Portfolio and Blog
on:
  push:
    branches: ["main"]
  # Rebuild daily so posts scheduled for a future date go live without a push.
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm ci

      - name: Build blog, homepage SEO, and sitemap
        run: npm run build

      - name: Check site integrity
        run: npm run check

      - name: Prerender pages
        run: npm run prerender

      - name: Organize Files
        run: |
          mkdir staging
          # 1. Copy root portfolio files (excluding source/git folders)
          # This assumes your main portfolio is at the root
          rsync -av --exclude='cms-auth' --exclude='scripts' --exclude='docs' --exclude='node_modules' --exclude='Dockerfile' --exclude='docker-compose.yml' --exclude='worker-configuration.d.ts' --exclude='public' --exclude='.git*' --exclude='staging' --exclude='dist' --exclude='card' --exclude='blog-site' --exclude='nginx-static.conf' ./ staging/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./staging

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The blog (pwn.aimansam.my) and link hub (aimansam.my) deploy from Cloudflare Pages on every push.
  # Posts scheduled for a future date need a rebuild when their date arrives, so the daily run
  # (and a manual run) also pings their deploy hooks. Skipped when the secrets are not set.
  rebuild-subdomains:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Trigger Cloudflare Pages deploy hooks
        env:
          BLOG_HOOK: ${{ secrets.CF_BLOG_DEPLOY_HOOK }}
          CARD_HOOK: ${{ secrets.CF_CARD_DEPLOY_HOOK }}
        run: |
          for hook in "$BLOG_HOOK" "$CARD_HOOK"; do
            if [ -n "$hook" ]; then curl -fsS -X POST "$hook" > /dev/null && echo "hook triggered"; fi
          done
