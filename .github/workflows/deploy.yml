name: Deploy Portfolio and Blog
on:
  push:
    branches: ["main"]
  # Rebuild daily so posts scheduled for a future date go live without a push.
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm ci

      - name: Build blog, homepage SEO, and sitemap
        run: npm run build

      - name: Check site integrity
        run: npm run check

      - name: Prerender pages
        run: npm run prerender

      - name: Organize Files
        run: |
          mkdir staging
          # 1. Copy root portfolio files (excluding source/git folders)
          # This assumes your main portfolio is at the root
          rsync -av --exclude='cms-auth' --exclude='scripts' --exclude='docs' --exclude='node_modules' --exclude='Dockerfile' --exclude='docker-compose.yml' --exclude='worker-configuration.d.ts' --exclude='public' --exclude='.git*' --exclude='staging' --exclude='dist' --exclude='card' --exclude='blog-site' --exclude='nginx-static.conf' --exclude='wrangler.*.jsonc' ./ staging/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./staging

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The blog (pwn.aimansam.my) and link hub (aimansam.my) are static-asset Workers on Cloudflare.
  # This job builds them and deploys straight from GitHub, so it does not depend on Cloudflare's own
  # Git integration. It also runs on the daily schedule, so posts dated in the future go live on time.
  # Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
  deploy-subdomains:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v7

      - name: Setup Node
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build blog and link hub
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci
          npm run build
          npm run check
          npm run prerender

      - name: Deploy blog (pwn.aimansam.my)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy --config wrangler.blog.jsonc

      - name: Deploy link hub (aimansam.my)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy --config wrangler.card.jsonc
