name: Deploy Portfolio and Blog
on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm ci

      - name: Build blog, homepage SEO, and sitemap
        run: npm run build

      - name: Prerender pages
        run: npm run prerender

      - name: Organize Files
        run: |
          mkdir staging
          # 1. Copy root portfolio files (excluding source/git folders)
          # This assumes your main portfolio is at the root
          rsync -av --exclude='cms-auth' --exclude='scripts' --exclude='docs' --exclude='node_modules' --exclude='Dockerfile' --exclude='docker-compose.yml' --exclude='worker-configuration.d.ts' --exclude='public' --exclude='.git*' --exclude='staging' ./ staging/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./staging

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
