<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found | Pwn Diary</title>
    <link rel="icon" href="/assets/images/zx10r/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/images/zx10r/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/assets/images/zx10r/apple-touch-icon.png" />
    <style>
      :root { color-scheme: light dark; --ink: #141414; --paper: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --ink: #f2f2f2; --paper: #121212; } }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: min(560px, calc(100% - 32px)); padding: 48px 0; }
      .code { font-size: 14px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 12px; }
      h1 { margin: 0 0 16px; font-size: 40px; line-height: 1.1; }
      p { margin: 0 0 28px; font-size: 18px; line-height: 1.5; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; }
      a { display: inline-flex; padding: 12px 20px; border: 2px solid var(--ink); border-radius: 999px; color: var(--ink); font-weight: 700; font-size: 15px; text-decoration: none; }
      a:first-child { background: var(--ink); color: var(--paper); }
      a:hover, a:focus-visible { outline: 3px solid #0055cc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>That page doesn't exist.</h1>
      <p>The link may be old or mistyped. Try one of these instead.</p>
      <nav aria-label="Helpful links">
        <a href="/">Pwn Diary</a>
        <a href="/archive/">Archive</a>
        <a href="https://portfolio.aimansam.my/">Portfolio</a>
      </nav>
    </main>
  </body>
</html>
