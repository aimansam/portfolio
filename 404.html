<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f172a" />
    <title>Page not found | Aiman Sam</title>
    <link rel="icon" href="/assets/images/zx10r/favicon-64.png" />
    <link rel="stylesheet" href="/css/layout/base.css?v=20261102">
    <link rel="stylesheet" href="/css/layout/home.css?v=20261102">
    <link rel="stylesheet" href="/css/typography.css">
    <link rel="stylesheet" href="/css/utilities.css">
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #ffffff; color: #141414; }
      .not-found { width: min(560px, calc(100% - 32px)); padding: 48px 0; text-align: left; }
      .not-found-code { font-size: 14px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 12px; }
      .not-found .main-title { margin: 0 0 16px; }
      .not-found .body-text { margin: 0 0 28px; font-size: 18px; line-height: 1.5; }
      .not-found-links { display: flex; flex-wrap: wrap; gap: 12px; }
      .not-found-links a { display: inline-flex; align-items: center; padding: 12px 20px; border: 2px solid #141414; border-radius: 999px; color: #141414; font-weight: 700; font-size: 15px; text-decoration: none; }
      .not-found-links a:first-child { background: #141414; color: #ffffff; }
      .not-found-links a:hover, .not-found-links a:focus-visible { outline: 3px solid #0055cc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="not-found" id="main-content">
      <p class="not-found-code">Error 404</p>
      <h1 class="main-title">That page doesn't exist.</h1>
      <p class="body-text">The link may be old or mistyped. Try one of these instead.</p>
      <nav class="not-found-links" aria-label="Helpful links">
        <a href="/">Home</a>
        <a href="/projects.html">Projects</a>
        <a href="/blog/">Blog</a>
        <a href="/gallery.html">Gallery</a>
      </nav>
    </main>
  </body>
</html>
